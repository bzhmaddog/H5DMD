sonar.organization=bzhmaddog
sonar.projectKey=bzhmaddog_H5DMD

sonar.sources=src
sonar.tests=tests
sonar.exclusions=**/*.d.ts
sonar.test.inclusions=tests/**/*.spec.ts,tests/**/*.test.ts

sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Mirror vitest.config.ts coverage excludes so Sonar doesn't count them as uncovered.
# Demo/, scripts and tool configs have no unit tests by design: keep them analysed for
# issues, but out of the coverage metric.
sonar.coverage.exclusions=src/interfaces/**,src/**/index.ts,Demo/**,scripts/**,**/*.config.*,vitest.setup.ts
# Each Demo page's main.ts is intentionally the same standalone bootstrap
sonar.cpd.exclusions=Demo/**
