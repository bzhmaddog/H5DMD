sonar.organization=bzhmaddog
sonar.projectKey=bzhmaddog_H5DMD

sonar.sources=src
sonar.tests=tests
sonar.exclusions=**/*.d.ts
sonar.test.inclusions=tests/**/*.spec.ts,tests/**/*.test.ts

